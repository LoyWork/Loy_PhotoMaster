# Builds the Windows installer and attaches it to a GitHub Release draft.
#
# Triggered by pushing a `v*` tag. The release uses that exact tag; keep its version in sync with
# `src-tauri/tauri.conf.json`, Cargo.toml and package.json. The release is created as a
# draft: check the attached installer on the Releases page, then press Publish.
#
# libheif is linked statically on Windows (see DEVELOP.md), so the installed application does not
# depend on heif.dll or codec DLLs that would otherwise have to be placed next to Picturama.exe.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  signing-config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.signing.outputs.ready }}
    steps:
      - id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI signing is not configured. Publish locally signed artifacts; no unsigned update will be built."
          fi

  build-windows:
    needs: signing-config
    if: needs.signing-config.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install vcpkg and static libheif
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{ github.workspace }}\vcpkg
          & ${{ github.workspace }}\vcpkg\bootstrap-vcpkg.bat
          & ${{ github.workspace }}\vcpkg\vcpkg.exe install "libheif[core]" --triplet x64-windows-static
          "VCPKG_ROOT=${{ github.workspace }}\vcpkg" | Out-File -Append $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static" | Out-File -Append $env:GITHUB_ENV
          "RUSTFLAGS=-C target-feature=+crt-static" | Out-File -Append $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      # `npm run licenses` runs `cargo metadata --offline`, which needs the crates in the local
      # registry cache — a fresh CI machine has none, so fetch them first.
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
        working-directory: src-tauri

      - name: Generate licenses.json.gz
        # Include the model and CPU runtime in the installer and third-party notices.
        # The preparation script pins and verifies the model and runtime checksums.
        run: |
          npm run models:prepare
          npm run licenses

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Picturama ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ''
